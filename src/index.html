<!doctype html>
<html lang="th">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Balance — HOSxP &amp; INVS Dashboard</title>
        <link rel="icon" type="image/svg+xml" href="/logo.svg" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
            rel="stylesheet"
        />
        <link data-trunk rel="css" href="assets/styles/theme.css" />
        <link data-trunk rel="css" href="assets/styles/app.css" />
        <link data-trunk rel="css" href="assets/styles/header.css" />
        <link data-trunk rel="css" href="assets/styles/connection-settings.css" />
        <link data-trunk rel="css" href="assets/styles/drug-search.css" />
        <link data-trunk rel="css" href="assets/styles/drug-trend-chart.css" />
        <link data-trunk rel="css" href="assets/styles/kpi-bar.css" />
        <link data-trunk rel="css" href="assets/styles/mapping.css" />
        <link data-trunk rel="css" href="assets/styles/discrepancy.css" />
        <!--
          Trunk's copy-file puts the file at the dist ROOT (dist/logo.svg),
          so the header/favicon reference "/logo.svg" (not "/assets/logo.svg",
          which would 404 in the packaged app that serves only dist/).
        -->
        <link data-trunk rel="copy-file" href="assets/logo.svg" />
    </head>
    <body>
        <!--
          The Tauri API is injected by the WebView itself (`withGlobalTauri:
          true` in tauri.conf.json), so `window.__TAURI__.core.invoke` exists
          synchronously with no network dependency — the app boots fully
          offline on a hospital LAN.  services/tauri.rs is the only place
          that touches it.
        -->
        <link data-trunk rel="rust" />
    </body>
</html>
