<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Base Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Glass Container Gradient -->
    <linearGradient id="glassBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#F1F5F9" stop-opacity="0.6" />
    </linearGradient>

    <!-- Dataset A: Gold/Yellow 3D Sphere (Updated from Green) -->
    <radialGradient id="yellowSphere" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="40%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#A16207" />
    </radialGradient>

    <!-- Dataset B: Purple/Violet 3D Sphere -->
    <radialGradient id="purpleSphere" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#DDD6FE" />
      <stop offset="40%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#5B21B6" />
    </radialGradient>

    <!-- Filters & Shadows -->
    <filter id="shadowBox" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#64748B" flood-opacity="0.15" />
    </filter>

    <filter id="shadow3D" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- App Base Frame (outer drop shadow intentionally removed) -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)" stroke="#CBD5E1" stroke-width="4" />
  <rect x="22" y="22" width="468" height="468" rx="90" fill="none" stroke="#FFFFFF" stroke-width="8" opacity="0.9" />

  <!-- Left Glass Box -->
  <rect x="52" y="72" width="180" height="368" rx="36" fill="url(#glassBox)" filter="url(#shadowBox)" stroke="#FFFFFF" stroke-width="4" />

  <!-- Right Glass Box -->
  <rect x="280" y="72" width="180" height="368" rx="36" fill="url(#glassBox)" filter="url(#shadowBox)" stroke="#FFFFFF" stroke-width="4" />

  <!-- Center Line Divider -->
  <line x1="256" y1="96" x2="256" y2="416" stroke="#94A3B8" stroke-width="4" stroke-dasharray="8 8" stroke-linecap="round" opacity="0.6" />

  <!-- LEFT SIDE: Yellow Spheres (3x5 Grid) -->
  <g filter="url(#shadow3D)">
    <!-- Row 1 -->
    <circle cx="92" cy="120" r="18" fill="url(#yellowSphere)" />
    <circle cx="142" cy="120" r="18" fill="url(#yellowSphere)" />
    <circle cx="192" cy="120" r="18" fill="url(#yellowSphere)" />
    <!-- Row 2 -->
    <circle cx="92" cy="180" r="18" fill="url(#yellowSphere)" />
    <circle cx="142" cy="180" r="18" fill="url(#yellowSphere)" />
    <circle cx="192" cy="180" r="18" fill="url(#yellowSphere)" />
    <!-- Row 3 -->
    <circle cx="92" cy="240" r="18" fill="url(#yellowSphere)" />
    <circle cx="142" cy="240" r="18" fill="url(#yellowSphere)" />
    <circle cx="192" cy="240" r="18" fill="url(#yellowSphere)" />
    <!-- Row 4 -->
    <circle cx="92" cy="300" r="18" fill="url(#yellowSphere)" />
    <circle cx="142" cy="300" r="18" fill="url(#yellowSphere)" />
    <circle cx="192" cy="300" r="18" fill="url(#yellowSphere)" />
    <!-- Row 5 -->
    <circle cx="92" cy="360" r="18" fill="url(#yellowSphere)" />
    <circle cx="142" cy="360" r="18" fill="url(#yellowSphere)" />
    <circle cx="192" cy="360" r="18" fill="url(#yellowSphere)" />

    <!-- Highlights -->
    <g fill="#FFFFFF" opacity="0.75">
      <circle cx="87" cy="115" r="4" /><circle cx="137" cy="115" r="4" /><circle cx="187" cy="115" r="4" />
      <circle cx="87" cy="175" r="4" /><circle cx="137" cy="175" r="4" /><circle cx="187" cy="175" r="4" />
      <circle cx="87" cy="235" r="4" /><circle cx="137" cy="235" r="4" /><circle cx="187" cy="235" r="4" />
      <circle cx="87" cy="295" r="4" /><circle cx="137" cy="295" r="4" /><circle cx="187" cy="295" r="4" />
      <circle cx="87" cy="355" r="4" /><circle cx="137" cy="355" r="4" /><circle cx="187" cy="355" r="4" />
    </g>
  </g>

  <!-- RIGHT SIDE: Purple Spheres (3x5 Grid) -->
  <g filter="url(#shadow3D)">
    <!-- Row 1 -->
    <circle cx="320" cy="120" r="18" fill="url(#purpleSphere)" />
    <circle cx="370" cy="120" r="18" fill="url(#purpleSphere)" />
    <circle cx="420" cy="120" r="18" fill="url(#purpleSphere)" />
    <!-- Row 2 -->
    <circle cx="320" cy="180" r="18" fill="url(#purpleSphere)" />
    <circle cx="370" cy="180" r="18" fill="url(#purpleSphere)" />
    <circle cx="420" cy="180" r="18" fill="url(#purpleSphere)" />
    <!-- Row 3 -->
    <circle cx="320" cy="240" r="18" fill="url(#purpleSphere)" />
    <circle cx="370" cy="240" r="18" fill="url(#purpleSphere)" />
    <circle cx="420" cy="240" r="18" fill="url(#purpleSphere)" />
    <!-- Row 4 -->
    <circle cx="320" cy="300" r="18" fill="url(#purpleSphere)" />
    <circle cx="370" cy="300" r="18" fill="url(#purpleSphere)" />
    <circle cx="420" cy="300" r="18" fill="url(#purpleSphere)" />
    <!-- Row 5 -->
    <circle cx="320" cy="360" r="18" fill="url(#purpleSphere)" />
    <circle cx="370" cy="360" r="18" fill="url(#purpleSphere)" />
    <circle cx="420" cy="360" r="18" fill="url(#purpleSphere)" />

    <!-- Highlights -->
    <g fill="#FFFFFF" opacity="0.75">
      <circle cx="315" cy="115" r="4" /><circle cx="365" cy="115" r="4" /><circle cx="415" cy="115" r="4" />
      <circle cx="315" cy="175" r="4" /><circle cx="365" cy="175" r="4" /><circle cx="415" cy="175" r="4" />
      <circle cx="315" cy="235" r="4" /><circle cx="365" cy="235" r="4" /><circle cx="415" cy="235" r="4" />
      <circle cx="315" cy="295" r="4" /><circle cx="365" cy="295" r="4" /><circle cx="415" cy="295" r="4" />
      <circle cx="315" cy="355" r="4" /><circle cx="365" cy="355" r="4" /><circle cx="415" cy="355" r="4" />
    </g>
  </g>
</svg>
