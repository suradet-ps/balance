name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-lint:
    name: Frontend Lint & Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Biome check
        run: bun run ci

      - name: TypeScript type check
        run: bun run type-check

  design-enforcement:
    name: No Inline Hex Colors
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check for raw hex colors in Vue components
        run: |
          violations=$(grep -rnE '#[0-9a-fA-F]{6}[^0-9a-fA-F]|#[0-9a-fA-F]{3}[^0-9a-fA-F]' src/ \
            --include='*.vue' \
            --include='*.css' \
            --exclude='kraken-theme.css' \
            || true)
          if [ -n "$violations" ]; then
            echo "::error::Inline hex colors found outside kraken-theme.css. Route all colors through CSS tokens."
            echo "$violations"
            exit 1
          fi
          echo "No inline hex colors found. Design system enforced."

  cargo-deny:
    name: Cargo Deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          command: check all
          manifest-path: src-tauri/Cargo.toml
