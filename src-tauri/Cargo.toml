[package]
name = "balance"
version = "0.1.0"
edition = "2024"
description = "Balance โ€” Combined HOSxP & INVS drug dashboard"
license = "MIT"

[lib]
name = "balance_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# MySQL (HOSxP)
sqlx = { version = "0.8", features = ["mysql", "runtime-tokio", "chrono"] }
# SQL Server (INVS)
tiberius = { version = "0.12", default-features = false, features = ["tokio", "rustls", "sql-browser-tokio"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures = "0.3"
# Settings encryption
encryptman-keyring = "0.1"
# Local app store (drug mappings, exclusions) — SQLite, bundled so no system
# lib is needed.  Version pinned to 0.31: its `libsqlite3-sys` 0.28 matches
# the requirement of sqlx-sqlite (pulled in unconditionally by sqlx 0.8), and
# two native `links = "sqlite3"` crates cannot coexist in one build graph.
rusqlite = { version = "0.31", features = ["bundled"] }
# Bulk mapping CSV import (pure Rust, no Node toolchain)
csv = "1.4"

